<!DOCTYPE html>
<html>
<head>
    <title>View Students</title>
</head>
<body>

    <h1>Student Details</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Course</th>
            <th>Semester</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.roll_number }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.semester }}</td>
        </tr>
        {% endfor %}

    </table>

    <br>
    <a href="/">Back to Dashboard</a>

</body>
</html>
